name: Validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run PowerShell smoke suite
        shell: ${{ matrix.shell }}
        run: ./tests/smoke.ps1
