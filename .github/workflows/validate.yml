name: Validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run Windows PowerShell 5.1 smoke suite
        shell: powershell
        run: ./tests/smoke.ps1

      - name: Run PowerShell 7 smoke suite
        shell: pwsh
        run: ./tests/smoke.ps1
